name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

      - name: Build installer (Windows, signed when secrets are configured)
        if: matrix.platform == 'win'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: npm run dist

      - name: Build installer (macOS arm64 + Intel)
        if: matrix.platform == 'mac'
        working-directory: packages/desktop
        env:
          # Free/ad-hoc: skip paid Apple Developer identity. Optional SignPath/CSC later.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/run-dist.cjs --mac

      - name: Build installer (Linux x64)
        if: matrix.platform == 'linux'
        working-directory: packages/desktop
        run: node scripts/run-dist.cjs --linux --x64

      - name: Build installer (Linux arm64)
        if: matrix.platform == 'linux-arm'
        working-directory: packages/desktop
        run: node scripts/run-dist.cjs --linux --arm64

      - name: Electron E2E smoke (Windows)
        if: matrix.platform == 'win'
        working-directory: packages/desktop
        run: npx electron . --e2e-smoke

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: warn

      # Optional free OSS signing via SignPath Foundation (docs/SIGNING.md).
      # Secrets are read into env first — GitHub forbids secrets.* directly in if:.
      - name: SignPath (Windows, optional)
        if: matrix.platform == 'win'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [ -z "$SIGNPATH_API_TOKEN" ]; then
            echo "SignPath secrets not configured — skipping (see docs/SIGNING.md)"
            exit 0
          fi
          echo "SignPath secrets present. Configure artifact upload + signpath/github-action-submit-signing-request in a follow-up once the SignPath project is approved."
          echo "Installers remain available as unsigned GitHub Release assets."

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mapfile -t files < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer artifacts found"
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — uploading assets"
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
            gh release edit "$GITHUB_REF_NAME" \
              --title "DevTent $version" \
              --notes-file CHANGELOG.md
          else
            echo "Creating release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" \
              --title "DevTent $version" \
              --notes-file CHANGELOG.md \
              "${files[@]}"
          fi
